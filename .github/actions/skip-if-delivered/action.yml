name: Skip if already delivered
description: >
  Guards the GitHub cron fallback. GitHub cron has been firing hours late since
  Aug 2026, so daily workflows are dispatched on time by cron-job.org and the
  cron stays only as a fallback. A dispatched run always proceeds; a scheduled
  run outputs skip=true if the main job already succeeded within the last
  `window-hours`. Only scheduled runs may skip: if dispatches could skip too,
  one late cron delivery would make the next on-time dispatch skip, and the
  workflow would stay stuck on GitHub's late timing. Fails open: if the GitHub
  API can't be read, the workflow runs.
inputs:
  window-hours:
    description: Look-back window in hours
    required: true
outputs:
  skip:
    description: "'true' if this is a scheduled run and a delivery already happened inside the window"
    value: ${{ steps.check.outputs.skip }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WINDOW_HOURS: ${{ inputs.window-hours }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
          echo "Triggered by $GITHUB_EVENT_NAME (primary trigger) — running."
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        wf=$(basename "${GITHUB_WORKFLOW_REF%@*}")
        since=$(date -u -d "-${WINDOW_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
        runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs" \
                 -f status=success -f "created=>=$since" --jq '.workflow_runs[].id' 2>/dev/null) || runs=""
        skip=false
        for id in $runs; do
          # A run whose main job was guarded out still ends "success", so count
          # a run only if some job other than the guard itself succeeded.
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.name != "guard" and .conclusion == "success")] | length' 2>/dev/null) || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "Already delivered by run $id (window since $since) — skipping."
            skip=true
            break
          fi
        done
        if [ "$skip" = false ]; then echo "No delivery since $since — running."; fi
        echo "skip=$skip" >> "$GITHUB_OUTPUT"
